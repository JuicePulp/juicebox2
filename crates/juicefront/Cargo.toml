[package]
name = "juicefront"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Astro frontend runner for Juicebox"
publish = false

[dependencies]
juiceutils = { path = "../juiceutils" }
sentry = { workspace = true, features = ["tower", "tower-axum-matched-path"] }
serde.workspace = true
# Spawns the Node/Astro child process; no networking or timers of its own.
tokio = { workspace = true, features = ["process", "macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
