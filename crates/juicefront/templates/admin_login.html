{% extends "admin.html" %}
{% block content %}
<h1>Admin Login</h1>
<form id="admin-login-form" method="POST" action="/api/admin/login">
<p><label for="username">Username</label><br><input id="username" name="username" type="text" required autocomplete="username"></p>
<p><label for="password">Password</label><br><input id="password" name="password" type="password" required autocomplete="current-password"></p>
<p id="login-error" aria-live="polite"></p>
<p><button type="submit">Login</button></p>
</form>
<p><a href="/">Back to upload</a></p>
{% endblock %}
