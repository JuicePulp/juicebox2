{% extends "admin.html" %}
{% block content %}
<h1>Site Announcement</h1>
<p>This message appears on the upload page for all visitors.</p>
<br>
<p><a href="/admin">Back to Admin Panel</a></p>
<br>
<form id="announcement-form">
<label>Message<input type="text" id="ann-message" name="message" required placeholder="e.g. Scheduled maintenance tonight" maxlength="280"></label>
<br><br>
<label>Link URL (optional)<input type="url" id="ann-link" name="link_url" placeholder="https://status.example.com"></label>
<br><br>
<label>Mode<select id="ann-mode" name="mode">
<option value="status">Status (no stripes)</option>
<option value="info">Info (gray stripes)</option>
<option value="warning" selected>Warning (orange stripes)</option>
<option value="danger">Danger (red stripes)</option>
</select></label>
<br><br>
<label><input type="checkbox" id="ann-active" name="is_active" checked>Active (visible to users)</label>
<br><br>
<button type="submit">Save Announcement</button>
</form>
<p id="ann-status" aria-live="polite"></p>
{% endblock %}
