{% extends "admin.html" %}
{% block content %}
<h1>Uploaded Files</h1>
<p><a href="/admin">Back to Admin Panel</a></p>
<div class="admin-toolbar">
<input type="text" id="search-input" placeholder="Search filename, ID, type, IP..." aria-label="Search filename, ID, type, IP...">
<select id="sort-select">
<option value="uploaded_at">Uploaded</option>
<option value="expires_at">Expires</option>
<option value="size_bytes">Size</option>
<option value="filename">Filename</option>
<option value="mime_type">Type</option>
</select>
<select id="dir-select">
<option value="desc">Newest first</option>
<option value="asc">Oldest first</option>
</select>
<select id="filter-type">
<option value="">All types</option>
<option value="image">Images</option>
<option value="video">Videos</option>
<option value="audio">Audio</option>
<option value="text">Text</option>
<option value="application">Other</option>
</select>
<button class="btn btn-primary" id="search-btn">Search</button>
</div>
<div id="files-list"><p>Loading...</p></div>
<div class="admin-status" id="files-status"></div>
{% endblock %}
