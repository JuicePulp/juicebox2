[package]
name = "juiceback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Backend API service for Juicebox"
publish = false

[features]
default = ["quic"]
quic = [
    "quinn",
    "quinn-proto",
    "h3",
    "h3-quinn",
    "rustls",
    "rustls-pki-types",
    "juiceutils/quic",
]

[dependencies]
argon2.workspace = true
async-compression.workspace = true
async-stream.workspace = true
axum.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
chrono.workspace = true
dashmap.workspace = true
flate2.workspace = true
futures.workspace = true
h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, optional = true }
hex.workspace = true
jsonwebtoken.workspace = true
juiceutils = { path = "../juiceutils" }
lettre.workspace = true
mimalloc.workspace = true
mime_guess.workspace = true
nanoid.workspace = true
percent-encoding.workspace = true
quinn = { workspace = true, optional = true }
quinn-proto = { workspace = true, optional = true }
r2d2.workspace = true
r2d2_sqlite.workspace = true
rand.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
sentry = { workspace = true, features = ["tower", "tower-axum-matched-path", "logs", "metrics"] }
sentry-tracing = { workspace = true, features = ["logs"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# Full runtime: HTTP servers, spawn_blocking DB pool, timers, signals, IPC.
tokio = { workspace = true, features = ["full"] }
tokio-stream.workspace = true
tokio-util.workspace = true
toml.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
tower_governor.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
utoipa.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
wiremock.workspace = true

[lints]
workspace = true
