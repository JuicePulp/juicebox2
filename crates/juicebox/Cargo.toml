[package]
name = "juicebox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Orchestrator that runs all the Juicebox services, couldn't be simpler."
publish = false

[dependencies]
juiceutils = { path = "../juiceutils" }
libc.workspace = true
# Process supervision only: spawn/kill children, watch for Ctrl-C/SIGTERM.
# `full` (not the minimal subset) on purpose: the supervisor's inner
# `cargo build -p juicehost -p juiceback -p juicefront` unifies tokio with
# `full` anyway, so requesting it here keeps both builds on one tokio
# variant instead of recompiling the tokio subtree on every switch.
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
