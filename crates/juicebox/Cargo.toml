[package]
name              = "juicebox"
version.workspace = true
edition.workspace = true
license.workspace = true
description       = "Orchestrator that runs all the Juicebox services,, couldn't be simpler."
publish           = false

[[bin]]
name = "juicebox"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["process", "signal", "macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
libc = "0.2"

[lints]
workspace = true
