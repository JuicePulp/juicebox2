  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{
      background:#1a1613;
      color:#e8ded4;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      display:flex;
      flex-direction:column;
      height:100dvh;
      overflow:hidden;
    }
    .topbar{
      display:flex;
      align-items:center;
      gap:.75rem;
      padding:.6rem 1rem;
      border-bottom:1px solid #2e2620;
      flex:none;
    }
    .brand{
      display:inline-flex;
      align-items:center;
      gap:.45rem;
      font-weight:800;
      letter-spacing:.02em;
      color:#f97316;
      white-space:nowrap;
      text-decoration:none;
      font-size:1.05rem;
    }
    .brand sup{font-size:.65em}
    .brand-logo{
      width:28px;
      height:28px;
      flex:none;
      border-radius:.35rem;
    }
    .fname{
      flex:1;
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      color:#e8ded4;
      font-size:.95rem;
    }
    .fsize{color:#a29188;font-size:.85rem;white-space:nowrap}
    .actions{display:flex;gap:.5rem;flex:none}
    .btn{
      display:inline-flex;
      align-items:center;
      gap:.35rem;
      padding:.45rem .9rem;
      border:1px solid #4a3d33;
      border-radius:.5rem;
      background:#241d17;
      color:#e8ded4;
      text-decoration:none;
      font-size:.85rem;
      font-weight:600;
      cursor:pointer;
    }
    .btn:hover{background:#2e251d;border-color:#f97316}
    .btn--primary{background:#f97316;border-color:#f97316;color:#0a0908}
    .btn--primary:hover{background:#fb923c}
    .stage{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:1rem;
      gap:1rem;
    }
    video#media,img#media{
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      border-radius:.5rem;
      background:#000;
    }
    video#media{width:100%;height:100%}
    img#media{width:auto;height:auto}
    .pdf-frame{width:100%;height:100%;border:0;border-radius:.5rem;background:#fff}
    .audio-hero{
      font-size:5rem;
      line-height:1;
      color:#f97316;
      background:#241d17;
      border:1px solid #4a3d33;
      border-radius:1rem;
      width:10rem;
      height:10rem;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    audio#media{width:100%}
    .audio-hero + audio#media{width:min(28rem,100%)}
    .text-view{
      width:min(60rem,100%);
      height:100%;
      overflow:auto;
      background:#100d0a;
      border:1px solid #2e2620;
      border-radius:.5rem;
      padding:1rem 1.25rem;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:.85rem;
      line-height:1.55;
      white-space:pre-wrap;
      word-break:break-word;
    }
    .fallback-note{color:#a29188;font-size:.9rem}
    .fallback-note a{color:#f97316}
    .dl-hero{display:flex;flex-direction:column;align-items:center;gap:.75rem;text-align:center}
    .dl-icon{
      font-size:3.5rem;
      color:#f97316;
      background:#241d17;
      border:1px solid #4a3d33;
      border-radius:1rem;
      width:7rem;
      height:7rem;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .dl-name{font-size:1.1rem;font-weight:700;word-break:break-all}
    .dl-meta{color:#a29188;font-size:.9rem}
    .dl-btn{
      margin-top:.5rem;
      padding:.7rem 2rem;
      background:#f97316;
      color:#0a0908;
      border-radius:.5rem;
      text-decoration:none;
      font-weight:700;
    }
    .dl-btn:hover{background:#fb923c}

<body>

  <main class="stage" id="stage">__STAGE__</main>
  <script>
  (function () {
    "use strict";
    var textview = document.getElementById("textview");
    if (textview) {
      var raw = textview.getAttribute("data-raw") || "";
      var stride = __TEXT_MAX__;
      var loaded = 0;
      var total = null;
      var loading = false;
      var done = false;
      var decoder = new TextDecoder();
      var sentinel = document.createElement("div");
      sentinel.setAttribute("aria-hidden", "true");
      textview.after(sentin);
      function parseTotal(res) {
        var cr = res.headers.get("Content-Range");
        if (cr) {
          var m = /\/(\d+)\s*$/.exec(cr);
          if (m) total = parseInt(m[1], 10);
        }
      }
      async function loadMore() {
        if (loading || done) return;
        if (total !== null && loaded >= total) { done = true; return; }
        loading = true;
        try {
          var res = await fetch(raw, { headers: { "Range": "bytes=" + loaded + "-" + (loaded + stride - 1) } });
          if (res.status === 416) { done = true; return; }
          if (!res.ok && res.status !== 206) throw new Error("bad status");
          parseTotal(res);
          var buf = new Uint8Array(await res.arrayBuffer());
          if (buf.length === 0) { done = true; return; }
          var last = total !== null && loaded + buf.length >= total;
          var text = decoder.decode(buf, last ? undefined : { stream: true });
          if (loaded === 0) textview.textContent = "";
          textview.appendChild(document.createTextNode(text));
          loaded += buf.length;
          if (last || (total !== null && loaded >= total)) done = true;
        } catch (e) {
          if (loaded === 0) textview.textContent = "Could not load a text preview.";
          done = true;
        } finally {
          loading = false;
        }
      }
      if ("IntersectionObserver" in window) {
        new IntersectionObserver(function (entries) {
          if (entries.some(function (en) { return en.isIntersecting; })) loadMore();
        }, { rootMargin: "1200px" }).observe(sentinel);
      } else {
        var scroller = textview;
        scroller.addEventListener("scroll", function () {
          if (scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 1200) loadMore();
        });
      }
      loadMore();
    }
  })();
  </script>
