<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Juicehost 451</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      background:#0a0908;
      color:#d5c7bc;
      font-family:system-ui,-apple-system,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:1.5rem;
    }
    .wrap{text-align:center;max-width:28rem}
    .emoji{font-size:3rem;margin-bottom:1rem;line-height:1}
    h1{
      font-size:1.5rem;
      color:#f5edea;
      font-weight:700;
      margin-bottom:.5rem;
    }
    p{
      color:#a29188;
      font-size:1rem;
      line-height:1.6;
    }
    .code{
      display:inline-block;
      margin-top:1rem;
      padding:.25rem .75rem;
      border:1px solid #2a2320;
      border-radius:.5rem;
      font-size:.8rem;
      color:#a29188;
      font-family:ui-monospace,monospace;
    }
    .back{
      display:inline-block;
      margin-top:1.5rem;
      padding:.6rem 1.4rem;
      background:#f97316;
      color:#0a0908;
      border-radius:.5rem;
      text-decoration:none;
      font-weight:600;
      font-size:.9rem;
      transition:background .15s;
    }
    .back:hover{background:#fb923c}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="emoji">&#129482;</div>
    <h1>this one&rsquo;s on ice.</h1>
    <p>This file has been frozen and is temporarily unavailable. Nothing to see here really.</p>
    <div><span class="code">451 Unavailable For Legal Reasons</span></div>
    <a class="back" href="/">go back home</a>
  </div>
</body>
</html>
