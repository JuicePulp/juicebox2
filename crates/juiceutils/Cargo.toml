[package]
name = "juiceutils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared config, security, validation, proxy, and HTTP/3 utilities for Juicebox"
publish = false

[features]
default = ["quic"]
quic = [
    "quinn",
    "quinn-proto",
    "h3",
    "h3-quinn",
    "rustls",
    "rustls-pki-types",
    "rcgen",
    "http-body-util",
]

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, optional = true }
hex.workspace = true
hmac.workspace = true
http-body-util = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }
quinn-proto = { workspace = true, optional = true }
rand.workspace = true
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
# Library subset: timers, signals and sync primitives for server helpers.
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "time"] }
toml.workspace = true
tower = { workspace = true, features = ["util"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
